<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Range Performance Comparison</title>
  <style>
    :root {
      --bg: #fbfbfc;
      --ink: #15181f;
      --muted: #8a92a0;
      --line: #d7dce4;
      --range: #21a66f;
      --c: #5b6472;
      --rust: #c65f2f;
      --swift: #e58a2f;
      --python: #3978c9;
      --missing: #b7bec8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .report {
      width: min(1120px, 100%);
      display: grid;
      gap: 24px;
    }

    .heading {
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 46px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 550;
    }

    .chart-wrap {
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .axis {
      stroke: #aeb6c2;
      stroke-width: 1.5;
    }

    .grid-line {
      stroke: var(--line);
      stroke-width: 1;
    }

    .tick,
    .label,
    .legend,
    .note {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .curve {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .range-curve {
      stroke-width: 5;
    }

    .point {
      stroke: #fff;
      stroke-width: 3;
    }

    .skip {
      fill: none;
      stroke: var(--missing);
      stroke-width: 2;
      stroke-dasharray: 4 4;
    }

    @media (max-width: 760px) {
      main {
        place-items: start;
        padding: 20px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="report" aria-label="Range performance comparison">
      <header class="heading">
        <h1>Range Performance Comparison</h1>
        <p class="meta">Local speed smoke test, N=200000, median runtime only. Values are relative to C per case on a compressed y-axis.</p>
      </header>

      <section class="chart-wrap" aria-label="Relative runtime XY chart">
        <svg viewBox="0 0 1120 620" role="img" aria-labelledby="chart-title chart-desc">
          <title id="chart-title">Range performance comparison</title>
          <desc id="chart-desc">A single XY chart comparing C, Rust, Swift, Python, and Range relative runtime across benchmark cases.</desc>

          <line class="grid-line" x1="90" y1="70" x2="1030" y2="70"></line>
          <line class="grid-line" x1="90" y1="118" x2="1030" y2="118"></line>
          <line class="grid-line" x1="90" y1="166" x2="1030" y2="166"></line>
          <line class="grid-line" x1="90" y1="230" x2="1030" y2="230"></line>
          <line class="grid-line" x1="90" y1="339" x2="1030" y2="339"></line>
          <line class="grid-line" x1="90" y1="448" x2="1030" y2="448"></line>

          <line class="axis" x1="90" y1="70" x2="90" y2="470"></line>
          <line class="axis" x1="90" y1="470" x2="1030" y2="470"></line>

          <text class="tick" x="62" y="452">1x</text>
          <text class="tick" x="48" y="343">1.5x</text>
          <text class="tick" x="56" y="234">2x</text>
          <text class="tick" x="56" y="170">5x</text>
          <text class="tick" x="48" y="122">10x</text>
          <text class="tick" x="48" y="74">20x</text>

          <text class="label" x="100" y="520">integer loop</text>
          <text class="label" x="322" y="520">strings</text>
          <text class="label" x="527" y="520">collections</text>
          <text class="label" x="744" y="520">constructs</text>
          <text class="label" x="963" y="520">generics</text>

          <path class="curve" stroke="var(--python)" d="M 120 77 C 210 96, 250 130, 330 129 C 430 130, 500 130, 540 129 C 640 127, 690 125, 750 123 C 850 108, 925 80, 970 76"></path>
          <path class="curve" stroke="var(--swift)" d="M 120 357 C 205 368, 260 385, 330 385 C 430 378, 475 372, 540 372 C 620 380, 685 394, 750 394 C 835 390, 900 381, 970 378"></path>
          <path class="curve" stroke="var(--rust)" d="M 120 433 C 205 450, 260 455, 330 455 C 420 448, 480 441, 540 439 C 620 441, 685 446, 750 446 C 835 446, 900 446, 970 446"></path>
          <path class="curve" stroke="var(--c)" d="M 120 448 C 250 448, 310 448, 330 448 C 430 448, 500 448, 540 448 C 640 448, 690 448, 750 448 C 850 448, 930 448, 970 448"></path>
          <path class="curve range-curve" stroke="var(--range)" d="M 120 400 C 210 402, 260 409, 330 409 C 430 414, 480 416, 540 415 C 630 408, 690 394, 750 394"></path>
          <path class="skip" d="M 766 394 C 825 390, 875 386, 930 386"></path>

          <circle class="point" cx="120" cy="77" r="6" fill="var(--python)"></circle>
          <circle class="point" cx="330" cy="129" r="6" fill="var(--python)"></circle>
          <circle class="point" cx="540" cy="129" r="6" fill="var(--python)"></circle>
          <circle class="point" cx="750" cy="123" r="6" fill="var(--python)"></circle>
          <circle class="point" cx="970" cy="76" r="6" fill="var(--python)"></circle>

          <circle class="point" cx="120" cy="400" r="7" fill="var(--range)"></circle>
          <circle class="point" cx="330" cy="409" r="7" fill="var(--range)"></circle>
          <circle class="point" cx="540" cy="415" r="7" fill="var(--range)"></circle>
          <circle class="point" cx="750" cy="394" r="7" fill="var(--range)"></circle>
          <circle class="skip" cx="970" cy="386" r="8"></circle>

          <text class="note" x="804" y="366">Range emit skipped generics</text>
          <text class="note" x="92" y="592">Lower is faster. Expanded native band plus compressed upper band keeps the comparison readable.</text>
        </svg>
      </section>
    </section>
  </main>
</body>
</html>
