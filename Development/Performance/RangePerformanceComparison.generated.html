<style>
:root{--bg:#fbfbfc;--ink:#15181f;--muted:#8a92a0;--line:#d7dce4;--range:#21a66f;--other:#555d6a;--cpu:#3978c9;--memory:#9b6a21;--missing:#b7bec8;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
main{min-height:100vh;display:grid;place-items:center;padding:30px;}
.report{width:min(1240px,100%);display:grid;gap:18px;}
.heading{display:grid;gap:6px;}
h1{margin:0;font-size:54px;font-weight:800;letter-spacing:0;}
.subtitle{margin:0;color:var(--muted);font-size:22px;font-weight:750;}
.chart-wrap{overflow:hidden;}
svg{display:block;width:100%;height:auto;}
.axis{stroke:#aeb6c2;stroke-width:2.5;}
.grid-line{stroke:var(--line);stroke-width:1.5;}
.tick,.label,.note{fill:var(--muted);font-size:15px;font-weight:700;}
.curve{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.52;}
.range-curve{stroke-width:11;opacity:1;}
.point{stroke:#fff;stroke-width:5;}
.skip{fill:none;stroke:var(--missing);stroke-width:3.5;stroke-dasharray:6 6;}
.pill{stroke:#fff;stroke-width:3;rx:13;ry:13;}
.pill-text{fill:#fff;font-size:14px;font-weight:800;}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.metric-card{border:1px solid var(--line);border-radius:8px;padding:18px;background:#fff;display:grid;gap:14px;}
.metric-card h2{margin:0;font-size:22px;font-weight:800;letter-spacing:0;}
.metric-card p{margin:0;color:var(--muted);font-size:14px;font-weight:700;}
.metric-rows{display:grid;gap:10px;}
.metric-row{display:grid;grid-template-columns:70px 1fr 58px;align-items:center;gap:10px;font-size:14px;font-weight:800;}
.metric-track{display:block;height:12px;border-radius:999px;background:#eef1f5;overflow:hidden;}
.metric-fill{display:block;height:100%;border-radius:999px;background:var(--other);}
.metric-fill.range{background:var(--range);}
.metric-fill.cpu{background:var(--cpu);}
.metric-fill.memory{background:var(--memory);}
.metric-value{color:var(--muted);text-align:right;}
@media(max-width:760px){main{place-items:start;padding:20px;}h1{font-size:36px;}}
@media(max-width:860px){.metric-grid{grid-template-columns:1fr;}}
</style>
