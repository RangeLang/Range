<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Range Self-Hosting Roadmap</title>
  <style>
    :root {
      --bg: #fbfbfc;
      --ink: #15181f;
      --muted: #8a92a0;
      --line: #d7dce4;
      --done: #21a66f;
      --todo: #c7ccd4;
      --lime: #8fdc2f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .diagram {
      width: min(1120px, 100%);
      overflow-x: auto;
      padding: 48px 0 112px;
    }

    .grid {
      min-width: 860px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 100px;
      column-gap: 24px;
      align-items: center;
    }

    .rail {
      grid-column: 1 / -1;
      grid-row: 1;
      position: relative;
      height: 16px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .rail::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 30%;
      border-radius: inherit;
      background: var(--done);
    }

    .step {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
      font-size: 17px;
      font-weight: 650;
      white-space: nowrap;
    }

    .step::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: var(--line);
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .step.done::after {
      background: var(--done);
    }

    .step.todo {
      color: var(--muted);
    }

    .label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .details {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
      line-height: 1.2;
    }

    .details li {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .detail-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .detail-done {
      color: var(--done);
    }

    .detail-next {
      color: var(--lime);
    }

    .top {
      grid-row: 1;
      align-self: stretch;
    }

    .top .label {
      bottom: calc(50% + 46px);
    }

    .bottom {
      grid-row: 1;
      align-self: stretch;
    }

    .bottom .label {
      top: calc(50% + 46px);
    }

    .file-reading {
      grid-column: 1;
    }

    .syntax-templates {
      grid-column: 2;
    }

    .syntax-collection {
      grid-column: 3;
    }

    .semantic-enrichment {
      grid-column: 4;
    }

    .runtime {
      grid-column: 5;
    }

    .goal {
      margin: 0 0 64px;
      font-size: 34px;
      font-weight: 750;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
