<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Range Self Hosting</title>
  <style>
    :root {
      --bg: #fbfbfc;
      --ink: #15181f;
      --muted: #8a92a0;
      --line: #d7dce4;
      --done: #21a66f;
      --todo: #c7ccd4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .diagram {
      width: min(1120px, 100%);
      overflow-x: auto;
      padding: 48px 0;
    }

    .grid {
      min-width: 860px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: 100px;
      column-gap: 24px;
      align-items: center;
    }

    .rail {
      grid-column: 1 / -1;
      grid-row: 1;
      position: relative;
      height: 16px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .rail::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 21.428%;
      border-radius: inherit;
      background: var(--done);
    }

    .step {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
      font-size: 17px;
      font-weight: 650;
      white-space: nowrap;
    }

    .step::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      border: 3px solid var(--todo);
      border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .step.done::after {
      border-color: var(--done);
      background: var(--done);
    }

    .step.todo {
      color: var(--muted);
    }

    .label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .top {
      grid-row: 1;
      align-self: stretch;
    }

    .top .label {
      bottom: calc(50% + 34px);
    }

    .bottom {
      grid-row: 1;
      align-self: stretch;
    }

    .bottom .label {
      top: calc(50% + 34px);
    }

    .files {
      grid-column: 1;
    }

    .lexer {
      grid-column: 2;
    }

    .parser {
      grid-column: 3;
    }

    .declare {
      grid-column: 4;
    }

    .macros {
      grid-column: 5;
    }

    .validate {
      grid-column: 6;
    }

    .emit {
      grid-column: 7;
    }

    .goal {
      margin: 0 0 64px;
      font-size: 34px;
      font-weight: 750;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="diagram" aria-label="Range self-hosting migration">
      <h1 class="goal">Range Self-Hosting Goal</h1>

      <div class="grid">
        <div class="rail" aria-hidden="true"></div>

        <div class="step bottom files done"><span class="label">Read Files</span></div>
        <div class="step bottom lexer done"><span class="label">Lexer</span></div>
        <div class="step top parser todo"><span class="label">Parser</span></div>
        <div class="step top declare todo"><span class="label">Declarations</span></div>
        <div class="step top macros todo"><span class="label">Macros</span></div>
        <div class="step top validate todo"><span class="label">Validation</span></div>
        <div class="step top emit todo"><span class="label">Emit</span></div>
      </div>
    </section>
  </main>
</body>
</html>
