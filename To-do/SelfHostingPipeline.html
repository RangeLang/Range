<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Range Self Hosting</title>
  <style>
    :root {
      --bg: #fbfbfc;
      --ink: #15181f;
      --muted: #8a92a0;
      --line: #d7dce4;
      --done: #21a66f;
      --todo: #c7ccd4;
      --cylinder-top: rgba(145, 241, 186, 0.95);
      --cylinder-mid: #21a66f;
      --cylinder-bottom: #0f6b43;
      --cylinder-shadow: rgba(8, 91, 54, 0.3);
      --rail-top-shadow: rgba(115, 226, 166, 0.42);
      --rail-bottom-shadow: rgba(8, 91, 54, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .diagram {
      width: min(1120px, 100%);
      overflow-x: auto;
      padding: 48px 0;
    }

    .grid {
      min-width: 860px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 100px;
      column-gap: 24px;
      align-items: center;
    }

    .rail {
      grid-column: 1 / -1;
      grid-row: 1;
      position: relative;
      height: 16px;
      border-radius: 999px;
      background:
        linear-gradient(
          to bottom,
          var(--cylinder-top) 0%,
          var(--cylinder-mid) 48%,
          var(--cylinder-bottom) 100%
        );
      box-shadow:
        inset 0 5px 7px rgba(255, 255, 255, 0.38),
        inset 0 -6px 8px rgba(4, 70, 41, 0.32),
        0 -14px 26px -14px var(--rail-top-shadow),
        0 18px 30px -14px var(--rail-bottom-shadow),
        0 14px 24px -18px var(--cylinder-shadow);
      overflow: hidden;
    }

    .rail::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 30%;
      border-radius: inherit;
      background:
        linear-gradient(
          to bottom,
          var(--cylinder-top) 0%,
          var(--cylinder-mid) 48%,
          var(--cylinder-bottom) 100%
        );
    }

    .step {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
      font-size: 17px;
      font-weight: 650;
      white-space: nowrap;
    }

    .step::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      border: 3px solid var(--todo);
      border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .step.done::after {
      border-color: var(--done);
      background: var(--done);
    }

    .step.todo {
      color: var(--muted);
    }

    .label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .top {
      grid-row: 1;
      align-self: stretch;
    }

    .top .label {
      bottom: calc(50% + 34px);
    }

    .bottom {
      grid-row: 1;
      align-self: stretch;
    }

    .bottom .label {
      top: calc(50% + 34px);
    }

    .file-reading {
      grid-column: 1;
    }

    .syntax-analysis {
      grid-column: 2;
    }

    .syntax-emission {
      grid-column: 3;
    }

    .semantic-enrichment {
      grid-column: 4;
    }

    .runtime {
      grid-column: 5;
    }

    .goal {
      margin: 0 0 64px;
      font-size: 34px;
      font-weight: 750;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="diagram" aria-label="Range self-hosting migration">
      <h1 class="goal">Range Self-Hosting Goal</h1>

      <div class="grid">
        <div class="rail" aria-hidden="true"></div>

        <div class="step bottom file-reading done"><span class="label">File Reading</span></div>
        <div class="step bottom syntax-analysis done"><span class="label">Syntax Analysis</span></div>
        <div class="step top syntax-emission todo"><span class="label">Syntax Emission</span></div>
        <div class="step top semantic-enrichment todo"><span class="label">Semantic Enrichment</span></div>
        <div class="step top runtime todo"><span class="label">Runtime</span></div>
      </div>
    </section>
  </main>
</body>
</html>
