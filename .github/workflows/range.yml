name: Range

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  check:
    name: Native compiler proof
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate native scripts
        run: bash -n scripts/range scripts/range-native scripts/check-range-compiler-candidate scripts/verify-range-compiler

      - name: Verify accepted bootstrap
        run: scripts/range check-compiler-integrity

      - name: Verify candidate reproduction
        run: scripts/range check-compiler-candidate
