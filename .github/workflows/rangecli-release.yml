name: RangeCLI Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: range-macos-arm64
            archive: range-macos-arm64.lang.tar.gz
            shell: bash
            package_template: Packaging/macOS/Range.lang
          - os: ubuntu-24.04
            artifact: range-linux-x64
            archive: range-linux-x64.lang.tar.gz
            shell: bash
            package_template: Packaging/Linux/Range.lang
          - os: windows-latest
            artifact: range-windows-x64
            archive: range-windows-x64.zip
            shell: pwsh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build release binary
        working-directory: RangeCLI
        run: swift build -c release --product RangeCLI

      - name: Package Unix install folder
        if: runner.os == 'macOS' || runner.os == 'Linux'
        working-directory: RangeCLI
        run: |
          package="${{ matrix.artifact }}.lang"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_version="$(
              sed -nE 's/.*SemanticVersion\(major: ([0-9]+), minor: ([0-9]+), patch: ([0-9]+)\).*/\1.\2.\3/p' \
                Sources/RangeCLI/RangeVersion.swift \
                | head -n 1
            )"
          fi
          mkdir -p dist
          cp -R "../${{ matrix.package_template }}" "dist/${package}"
          cp .build/release/RangeCLI "dist/${package}/range"
          cp -R ../RangeCore "dist/${package}/RangeCore"
          printf '%s\n' "$release_version" > "dist/${package}/VERSION"
          chmod 755 "dist/${package}/range"
          chmod 755 "dist/${package}/install.sh" "dist/${package}/uninstall.sh"
          tar -C dist -czf ${{ matrix.archive }} "$package"

      - name: Package Windows install folder
        if: runner.os == 'Windows'
        working-directory: RangeCLI
        run: |
          $package = "${{ matrix.artifact }}"
          $releaseVersion = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($releaseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            $versionSource = Get-Content "Sources/RangeCLI/RangeVersion.swift" -Raw
            if ($versionSource -match 'SemanticVersion\(major: ([0-9]+), minor: ([0-9]+), patch: ([0-9]+)\)') {
              $releaseVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            }
          }
          New-Item -ItemType Directory -Force -Path "dist\$package" | Out-Null
          Copy-Item -Recurse -Force "..\Packaging\Windows\Range\*" "dist\$package"
          $binary = Get-ChildItem -Path ".build" -Recurse -Filter "RangeCLI.exe" |
            Where-Object { $_.FullName -match '[\\/](release)[\\/]' } |
            Select-Object -First 1
          if (-not $binary) {
            throw "Build succeeded but RangeCLI.exe was not found under .build."
          }
          Copy-Item -Force $binary.FullName "dist\$package\range.exe"
          Copy-Item -Recurse -Force "..\RangeCore" "dist\$package\RangeCore"
          Set-Content -NoNewline -Path "dist\$package\VERSION" -Value $releaseVersion
          Compress-Archive -Path "dist\$package" -DestinationPath "${{ matrix.archive }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: RangeCLI/${{ matrix.archive }}

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
