name: RangeCLI Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: range-macos-arm64
            archive: range-macos-arm64.lang.tar.gz
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build release binary
        working-directory: RangeCLI
        run: swift build -c release --product RangeCLI

      - name: Package macOS install folder
        if: runner.os == 'macOS'
        working-directory: RangeCLI
        run: |
          package="${{ matrix.artifact }}.lang"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_version="$(
              sed -nE 's/.*SemanticVersion\(major: ([0-9]+), minor: ([0-9]+), patch: ([0-9]+)\).*/\1.\2.\3/p' \
                Sources/RangeCLI/RangeVersion.swift \
                | head -n 1
            )"
          fi
          mkdir -p dist
          cp -R ../Packaging/macOS/Range.lang "dist/${package}"
          mkdir -p "dist/${package}/bin"
          mkdir -p "dist/${package}/share/range"
          cp .build/release/RangeCLI "dist/${package}/bin/range"
          cp -R ../RangeCore "dist/${package}/share/range/RangeCore"
          mkdir -p "dist/${package}/share/range/Skills"
          cp -R ../.codex/skills/range-onboarding "dist/${package}/share/range/Skills/range-onboarding"
          printf '%s\n' "$release_version" > "dist/${package}/VERSION"
          chmod 755 "dist/${package}/bin/range"
          chmod 755 "dist/${package}/install.sh" "dist/${package}/uninstall.sh"
          tar -C dist -czf ${{ matrix.archive }} "$package"

      - name: Package macOS installer package
        if: runner.os == 'macOS'
        working-directory: RangeCLI
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_version="$(
              sed -nE 's/.*SemanticVersion\(major: ([0-9]+), minor: ([0-9]+), patch: ([0-9]+)\).*/\1.\2.\3/p' \
                Sources/RangeCLI/RangeVersion.swift \
                | head -n 1
            )"
          fi
          package_root="dist/${{ matrix.artifact }}.pkgroot"
          mkdir -p "${package_root}/usr/local/bin"
          mkdir -p "${package_root}/usr/local/share/range"
          cp .build/release/RangeCLI "${package_root}/usr/local/bin/range"
          cp -R ../RangeCore "${package_root}/usr/local/share/range/RangeCore"
          mkdir -p "${package_root}/usr/local/share/range/Skills"
          cp -R ../.codex/skills/range-onboarding "${package_root}/usr/local/share/range/Skills/range-onboarding"
          chmod 755 "${package_root}/usr/local/bin/range"
          pkgbuild \
            --root "${package_root}" \
            --identifier "com.georgetchelidze.range.cli" \
            --version "${release_version}" \
            --install-location "/" \
            "${{ matrix.artifact }}.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: RangeCLI/${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}.pkg
          path: RangeCLI/${{ matrix.artifact }}.pkg

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
