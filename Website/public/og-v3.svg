<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171a20; }
    .title { font-size: 22px; font-weight: 600; }
    .scale, .axis, .muted { fill: #85878b; }
    .scale { font-size: 15px; }
    .label, .value { font-size: 15px; }
    .label { text-anchor: end; }
    .value { font-variant-numeric: tabular-nums; }
    .range-label, .range-value { font-weight: 600; }
    .grid { stroke: #e2e2e0; stroke-width: 1; }
    .peer { fill: #f7a56d; }
    .range { fill: #3798ef; }
    .axis { font-size: 12px; }
    .status-title { font-size: 16px; font-weight: 600; }
    .status { font-size: 13px; }
  </style>

  <!-- Loops -->
  <g transform="translate(34 28)">
    <text class="title" x="0" y="22">Loops</text>
    <text class="scale" x="530" y="22" text-anchor="end">20m iterations</text>
    <line class="grid" x1="88" y1="48" x2="88" y2="230"/>
    <line class="grid" x1="294" y1="48" x2="294" y2="230"/>
    <text class="label muted" x="76" y="68">C++</text><rect class="peer" x="88" y="51" width="316" height="22" rx="4"/><text class="value" x="422" y="68">61.3 ms</text>
    <text class="label muted" x="76" y="96">C</text><rect class="peer" x="88" y="79" width="316" height="22" rx="4"/><text class="value" x="422" y="96">61.4 ms</text>
    <text class="label muted" x="76" y="124">Rust</text><rect class="peer" x="88" y="107" width="319" height="22" rx="4"/><text class="value" x="422" y="124">61.9 ms</text>
    <text class="label muted" x="76" y="152">Swift</text><rect class="peer" x="88" y="135" width="322" height="22" rx="4"/><text class="value" x="422" y="152">62.5 ms</text>
    <text class="label range-label" x="76" y="180">Range</text><rect class="range" x="88" y="163" width="341" height="22" rx="4"/><text class="value range-value" x="444" y="180">66.3 ms</text>
    <text class="label muted" x="76" y="208">Go</text><rect class="peer" x="88" y="191" width="410" height="22" rx="4"/><text class="value" x="506" y="208">79.6 ms</text>
    <line class="grid" x1="88" y1="220" x2="500" y2="220"/>
    <text class="axis" x="88" y="238">0</text><text class="axis" x="294" y="238" text-anchor="middle">40</text><text class="axis" x="500" y="238" text-anchor="end">80</text>
  </g>

  <!-- Noise -->
  <g transform="translate(634 28)">
    <text class="title" x="0" y="22">Noise</text>
    <text class="scale" x="530" y="22" text-anchor="end">50m samples</text>
    <line class="grid" x1="88" y1="48" x2="88" y2="230"/>
    <line class="grid" x1="294" y1="48" x2="294" y2="230"/>
    <text class="label muted" x="76" y="68">C</text><rect class="peer" x="88" y="51" width="323" height="22" rx="4"/><text class="value" x="426" y="68">70.5 ms</text>
    <text class="label muted" x="76" y="96">C++</text><rect class="peer" x="88" y="79" width="325" height="22" rx="4"/><text class="value" x="426" y="96">70.9 ms</text>
    <text class="label muted" x="76" y="124">Go</text><rect class="peer" x="88" y="107" width="361" height="22" rx="4"/><text class="value" x="464" y="124">78.9 ms</text>
    <text class="label range-label" x="76" y="152">Range</text><rect class="range" x="88" y="135" width="377" height="22" rx="4"/><text class="value range-value" x="480" y="152">82.4 ms</text>
    <text class="label muted" x="76" y="180">Rust</text><rect class="peer" x="88" y="163" width="379" height="22" rx="4"/><text class="value" x="480" y="180">82.9 ms</text>
    <text class="label muted" x="76" y="208">Swift</text><rect class="peer" x="88" y="191" width="379" height="22" rx="4"/><text class="value" x="480" y="208">82.9 ms</text>
    <line class="grid" x1="88" y1="220" x2="500" y2="220"/>
    <text class="axis" x="88" y="238">0</text><text class="axis" x="294" y="238" text-anchor="middle">45</text><text class="axis" x="500" y="238" text-anchor="end">90</text>
  </g>

  <!-- Function Calls -->
  <g transform="translate(34 304)">
    <text class="title" x="0" y="22">Function Calls</text>
    <text class="scale" x="530" y="22" text-anchor="end">20m iterations</text>
    <line class="grid" x1="88" y1="48" x2="88" y2="230"/>
    <line class="grid" x1="294" y1="48" x2="294" y2="230"/>
    <text class="label muted" x="76" y="68">Go</text><rect class="peer" x="88" y="51" width="331" height="22" rx="4"/><text class="value" x="432" y="68">64.2 ms</text>
    <text class="label muted" x="76" y="96">C++</text><rect class="peer" x="88" y="79" width="347" height="22" rx="4"/><text class="value" x="448" y="96">67.4 ms</text>
    <text class="label muted" x="76" y="124">C</text><rect class="peer" x="88" y="107" width="348" height="22" rx="4"/><text class="value" x="448" y="124">67.5 ms</text>
    <text class="label muted" x="76" y="152">Rust</text><rect class="peer" x="88" y="135" width="350" height="22" rx="4"/><text class="value" x="450" y="152">67.9 ms</text>
    <text class="label muted" x="76" y="180">Swift</text><rect class="peer" x="88" y="163" width="353" height="22" rx="4"/><text class="value" x="454" y="180">68.5 ms</text>
    <text class="label range-label" x="76" y="208">Range</text><rect class="range" x="88" y="191" width="372" height="22" rx="4"/><text class="value range-value" x="474" y="208">72.3 ms</text>
    <line class="grid" x1="88" y1="220" x2="500" y2="220"/>
    <text class="axis" x="88" y="238">0</text><text class="axis" x="294" y="238" text-anchor="middle">40</text><text class="axis" x="500" y="238" text-anchor="end">80</text>
  </g>

  <!-- Strings -->
  <g transform="translate(634 304)">
    <text class="title" x="0" y="22">Strings</text>
    <text class="scale" x="530" y="22" text-anchor="end">100k appends</text>
    <line class="grid" x1="88" y1="48" x2="88" y2="230"/>
    <line class="grid" x1="294" y1="48" x2="294" y2="230"/>
    <text class="label muted" x="76" y="68">C</text><rect class="peer" x="88" y="51" width="268" height="22" rx="4"/><text class="value" x="370" y="68">3.9 ms</text>
    <text class="label muted" x="76" y="96">C++</text><rect class="peer" x="88" y="79" width="268" height="22" rx="4"/><text class="value" x="370" y="96">3.9 ms</text>
    <text class="label range-label" x="76" y="124">Range</text><rect class="range" x="88" y="107" width="282" height="22" rx="4"/><text class="value range-value" x="384" y="124">4.1 ms</text>
    <text class="label muted" x="76" y="152">Rust</text><rect class="peer" x="88" y="135" width="288" height="22" rx="4"/><text class="value" x="390" y="152">4.2 ms</text>
    <text class="label muted" x="76" y="180">Go</text><rect class="peer" x="88" y="163" width="330" height="22" rx="4"/><text class="value" x="432" y="180">4.8 ms</text>
    <text class="label muted" x="76" y="208">Swift</text><rect class="peer" x="88" y="191" width="385" height="22" rx="4"/><text class="value" x="487" y="208">5.6 ms</text>
    <line class="grid" x1="88" y1="220" x2="500" y2="220"/>
    <text class="axis" x="88" y="238">0</text><text class="axis" x="294" y="238" text-anchor="middle">3</text><text class="axis" x="500" y="238" text-anchor="end">6</text>
    <text class="status" x="88" y="260">Range peak memory: 1.9 MB · peers: 1.8–4.1 MB</text>
  </g>

  <line class="grid" x1="34" y1="578" x2="1166" y2="578"/>
  <text class="status-title" x="34" y="600">Range status · 4/6 emitted and passed</text>
  <text class="status muted" x="34" y="621">Not emitted: Collections · resolution stage 2</text>
  <text class="status muted" x="380" y="621">Not emitted: Constructs · constructor-argument parse reachability</text>
  <text class="status muted" x="986" y="621">Emitted but failed: none</text>
</svg>
